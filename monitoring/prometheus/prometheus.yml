global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "link-service"
    static_configs:
      - targets: ["link-service:8001"]
    metrics_path: /metrics

  - job_name: "redirect-service"
    static_configs:
      - targets: ["redirect-service:8002"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
