apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-service
  namespace: shortly
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup-service
              image: cleanup-service:latest
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: shortly-config
                - secretRef:
                    name: shortly-secrets
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
